<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0e7c72"/>

  <!-- double-end wrench, rotated 45° (cuts drawn in bg color) -->
