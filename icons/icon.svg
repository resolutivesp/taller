    <circle cx="256" cy="120" r="60" fill="#ffffff"/>
    <rect x="232" y="130" width="48" height="240" rx="20" fill="#ffffff"/>
    <circle cx="256" cy="380" r="48" fill="#ffffff"/>
    <rect x="236" y="18" width="40" height="102" rx="6" fill="#0e7c72"/>
    <circle cx="256" cy="380" r="22" fill="#0e7c72"/>
  </g>

  <!-- medical cross badge, bottom-right -->
  <circle cx="378" cy="378" r="82" fill="#f5a623"/>
  <rect x="361" y="330" width="34" height="96" rx="8" fill="#3b2500"/>
  <rect x="330" y="361" width="96" height="34" rx="8" fill="#3b2500"/>
</svg>
